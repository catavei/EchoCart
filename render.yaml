# Render Blueprint for the hosted EchoCart demo (PayPal sandbox only).
# Render dashboard > New > Blueprint > pick this repository. Render asks for the three secrets below.
services:
  - type: web
    name: echocart
    runtime: docker
    plan: free
    healthCheckPath: /api/status
    autoDeploy: true
    envVars:
      # Each browser gets its own shopper (linked PayPal, orders, limit, PIN), so judges
      # trying the demo at the same time never share a cart or a PayPal account.
      - key: SHOPPERS
        value: per_browser
      - key: PAYPAL_API_BASE
        value: https://api-m.sandbox.paypal.com
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      # Offline parser: no Claude key needed, so the hosted demo costs nothing to run.
      # To use Claude, add ANTHROPIC_API_KEY in the service's Environment tab on Render
      # and set LLM_MODE to anthropic.
      - key: LLM_MODE
        value: offline
      # APP_BASE_URL is not needed: EchoCart uses Render's RENDER_EXTERNAL_URL.
